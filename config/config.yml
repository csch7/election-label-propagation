# Configuration for the election label propagation project.
# Every value here is read by the code (src/config.py); command-line options in
# main.py override the experiment settings for a single run.

# ---- Data -----------------------------------------------------------------
census_year: null        # Census YEAR code for the demographic features (null = latest in the file)
target_year: 2024        # election whose county winners are predicted
previous_year: 2020      # election used to seed the previous-year experiment

# ---- Graph construction -----------------------------------------------------
demographic_graph_k: 5          # each county is linked to its k most similar counties
demographic_similarity: 0.8     # similarity cutoff; only used by the "threshold" and "hybrid" graph methods
geographic_scale_km: 100        # proximity = 1 / (1 + km / scale); only changes kNN vote weights
blend_lambdas: [0.25, 0.5, 0.75]  # combined graph: share of border (vs demographic); tuned by cross-validation

# ---- Train / test splits ----------------------------------------------------
test_fraction: 0.2       # share of counties held out for testing (when fewer labels are known, the unused
                         # training-pool counties are scored as well)
cv_folds: 5              # cross-validation folds used for tuning
block_size: 10           # target size of each test block in the block split
split_strategies: [block]   # test-split types run by main.py (also available: stratified)
report_split: block      # split shown in the figures

# ---- Experiments (main.py) ----------------------------------------------------
seeds: 10                # random repeats; each redraws the split, known counties and folds
train_fractions: [max]   # share of ALL counties whose labels are known ("max" = every non-test county)
previous_year_train_fractions: [0.05, 0.1, 0.2, 0.4, max]

# ---- kNN ----------------------------------------------------------------------
nearest_neighbors: 5            # default k when KNNClassifier is created without one
knn_k_grid: [1, 3, 5, 10, 20, 50]   # values of k tried when tuning
knn_weighted_grid: [true, false]    # vote weighted by similarity vs equal votes

# ---- Label propagation --------------------------------------------------------
lp_alpha: 0.9            # default alpha (0-1): how far labels spread
lp_max_iter: 1000
lp_tol: 1.0e-6           # stop when scores change by less than this
lp_alpha_grid: [0.5, 0.8, 0.9, 0.95, 0.99]

# ---- Decision threshold (tuned for every model) -----------------------------------
threshold_grid: {start: 0.05, stop: 0.95, step: 0.05}

# ---- Previous-year experiment grids (smaller, to keep it fast) ---------------------
previous_year_knn_k_grid: [3, 10, 50]
previous_year_lp_alpha_grid: [0.5, 0.8, 0.95]
